name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Type check (mypy --strict)
        run: python -m mypy
      - name: Tests (pytest)
        run: python -m pytest

  notebook:
    name: demo notebook executes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Execute notebook
        run: |
          python - <<'EOF'
          import nbformat
          from nbclient import NotebookClient
          nb = nbformat.read("notebooks/demo.ipynb", as_version=4)
          NotebookClient(nb, timeout=900, kernel_name="python3",
                         resources={"metadata": {"path": "notebooks"}}).execute()
          print("notebook executed:", len(nb.cells), "cells")
          EOF
